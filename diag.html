<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>能耗对比图诊断 - CORX IoT</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b1220; color: #cbd5e1;
    font: 14px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif;
    padding: 24px; max-width: 1100px; margin: 0 auto;
  }
  h1 { font-size: 20px; color: #22d3ee; margin-bottom: 4px; }
  .sub { color: #64748b; font-size: 12px; margin-bottom: 20px; }
  .card {
    background: rgba(30, 41, 59, .55); border: 1px solid rgba(148,163,184,.18);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; color: #7dd3fc; margin-bottom: 10px; }
  .ok { color: #4ade80; } .bad { color: #f87171; } .warn { color: #fbbf24; }
  .dim { color: #64748b; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
  th, td { border: 1px solid rgba(148,163,184,.2); padding: 5px 9px; text-align: left; }
  th { background: rgba(34,211,238,.08); color: #7dd3fc; font-weight: 600; }
  code, pre { font-family: Consolas, monospace; }
  pre { background: rgba(2,6,23,.6); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: 12px; margin: 8px 0; }
  .verdict {
    border-left: 4px solid #f87171; background: rgba(248,113,113,.08);
    padding: 10px 14px; border-radius: 0 8px 8px 0; margin-top: 10px;
  }
  .verdict.good { border-color: #4ade80; background: rgba(74,222,128,.08); }
  button {
    background: #0e7490; color: #fff; border: 0; border-radius: 8px;
    padding: 8px 20px; font-size: 14px; cursor: pointer; margin-bottom: 16px;
  }
  button:hover { background: #0891b2; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; margin-left: 6px; }
  .pill.g { background: rgba(74,222,128,.15); color: #4ade80; }
  .pill.r { background: rgba(248,113,113,.15); color: #f87171; }
  .pill.y { background: rgba(251,191,36,.15); color: #fbbf24; }
</style>
</head>
<body>
<h1>能耗对比图诊断</h1>
<div class="sub">自动检查本地缓存 → 云端数据 → 计算链路，定位 9/1、9/2 柱子缺失的断点。诊断只在你的浏览器运行，不会修改任何数据。</div>
<button onclick="run()">重新运行诊断</button>
<div id="out"><span class="dim">正在运行…</span></div>

<script>
(function () {
  const SUPA_URL = 'https://sdzmynpobsulpztavpqs.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkem15bnBvYnN1bHB6dGF2cHFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzgwOTYsImV4cCI6MjEwMzE1NDA5Nn0.uslI8V3RT-yH3vNF_UIBVyn8xUPn3qt-bxGFLo97UYI';

  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const fmt = ms => { const d = new Date(ms); const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  const dayKey = ms => fmt(ms).slice(0, 10);
  const out = [];

  function section(title, html) { out.push(`<div class="card"><h2>${esc(title)}</h2>${html}</div>`); }

  async function run() {
    document.getElementById('out').innerHTML = '<span class="dim">正在运行…</span>';
    out.length = 0;
    const findings = [];

    /* ---------- 1. 本地 localStorage ---------- */
    let cloudCfg = null, cloudOff = null, ecfg = null, localRecs = [];
    try { cloudCfg = JSON.parse(localStorage.getItem('corx_cloud_cfg') || 'null'); } catch (e) {}
    cloudOff = localStorage.getItem('corx_cloud_off');
    try { ecfg = JSON.parse(localStorage.getItem('corx_energy_cfg') || 'null'); } catch (e) {}
    try { localRecs = JSON.parse(localStorage.getItem('corx_report_recs') || 'null') || []; } catch (e) {}
    const cloudReady = !!cloudCfg && cloudOff !== '1';

    let s1 = `<div>云端开关 corx_cloud_cfg：<b class="${cloudCfg ? 'ok' : 'bad'}">${cloudCfg ? '存在（' + esc(cloudCfg.url || '') + '）' : '不存在'}</b>
      <span class="dim">｜</span>corx_cloud_off：<b class="${cloudOff === '1' ? 'bad' : 'ok'}">${cloudOff === '1' ? '1（已显式停用！）' : esc(cloudOff ?? '未设置')}</b>
      <span class="dim">｜</span>cloudReady()：<b class="${cloudReady ? 'ok' : 'bad'}">${cloudReady}</b></div>`;
    if (!cloudReady) findings.push('<b class="bad">云端同步未就绪</b>（corx_cloud_cfg 缺失或 corx_cloud_off=1）→ 10 分钟增量拉取 effect 直接 return，云端新记录进不来');

    if (ecfg) {
      s1 += `<div style="margin-top:8px">能耗配置 corx_energy_cfg：<code>hwIds=[${(ecfg.hwIds || []).join(', ')}]</code>
        <code>baseVals=${esc(JSON.stringify(ecfg.baseVals || null))}</code>
        <code>baseHistory=${esc(JSON.stringify(ecfg.baseHistory || null))}</code></div>`;
      if (!ecfg.baseVals || !Object.keys(ecfg.baseVals).length)
        findings.push('corx_energy_cfg 没有 baseVals → 电表差值模式不生效');
    } else {
      s1 += '<div class="warn" style="margin-top:8px">corx_energy_cfg 不存在！</div>';
      findings.push('<b class="bad">corx_energy_cfg 不存在</b> → 没有任何点位参与差值计算');
    }

    const statDays = arr => {
      const m = new Map();
      for (const r of arr) { const k = dayKey(new Date(r.t).getTime()); m.set(k, (m.get(k) || 0) + 1); }
      return m;
    };
    const lrEarliest = localRecs.length ? fmt(new Date(localRecs[0].t).getTime()) : '-';
    const lrLatest = localRecs.length ? fmt(new Date(localRecs[localRecs.length - 1].t).getTime()) : '-';
    const lm = statDays(localRecs);
    let s1r = `<div>本地 corx_report_recs：<b>${localRecs.length}</b> 条，最早 <code>${esc(lrEarliest)}</code>，最新 <code>${esc(lrLatest)}</code></div>`;
    if (localRecs.length) {
      const days = [...lm.keys()].sort();
      const show = days.slice(-12);
      s1r += '<table><tr><th>日期（本地时区）</th><th>本地条数</th></tr>' +
        show.map(d => `<tr><td>${d}</td><td>${lm.get(d)}${d >= '2026-09-01' && lm.get(d) === 0 ? ' <span class="pill r">0</span>' : ''}</td></tr>`).join('') + '</table>';
      if (lm.get('2026-09-01') === 0 && lm.get('2026-09-02') === 0)
        findings.push('本地 corx_report_recs 里 9/1、9/2 条数为 0 → 本地采集本身没覆盖（需靠云端补齐）');
    }
    section('① 本地浏览器状态（localStorage）', s1 + s1r);

    /* ---------- 2. 云端 Supabase ---------- */
    let cloudRecs = [];
    let cloudErr = '';
    const startISO = new Date(Date.now() - 10 * 86400000).toISOString();
    const endISO = new Date().toISOString();
    const url = SUPA_URL + '/rest/v1/report_records?select=t,v&t=gte.' + encodeURIComponent(startISO) + '&t=lt.' + encodeURIComponent(endISO) + '&order=t.asc&limit=50000';
    try {
      const r = await fetch(url, { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY } });
      if (!r.ok) cloudErr = 'HTTP ' + r.status;
      else cloudRecs = await r.json();
    } catch (e) { cloudErr = e && e.message ? e.message : String(e); }

    let s2;
    if (cloudErr) {
      s2 = `<div class="bad">云端拉取失败：${esc(cloudErr)}</div>`;
      findings.push('<b class="bad">浏览器内云端拉取失败</b>：' + esc(cloudErr) + '（若主应用同样失败，增量合并永远不会发生）');
    } else {
      const cm = statDays(cloudRecs);
      const cEarliest = cloudRecs.length ? fmt(new Date(cloudRecs[0].t).getTime()) : '-';
      const cLatest = cloudRecs.length ? fmt(new Date(cloudRecs[cloudRecs.length - 1].t).getTime()) : '-';
      let s2r = `<div>云端 report_records（近 10 天窗口）：<b>${cloudRecs.length}</b> 条，最早 <code>${esc(cEarliest)}</code>，最新 <code>${esc(cLatest)}</code></div>`;
      if (cloudRecs.length) {
        const days = [...cm.keys()].sort().slice(-12);
        s2r += '<table><tr><th>日期（本地时区）</th><th>云端条数</th></tr>' +
          days.map(d => `<tr><td>${d}</td><td>${cm.get(d)}</td></tr>`).join('') + '</table>';
      }
      s2 = s2r;
      if (cm.get('2026-09-01') > 0 || cm.get('2026-09-02') > 0) {
        if (cloudReady) findings.push('云端有 9 月数据且 cloudReady 正常 → 若主页面仍缺柱，断点在<b>合并/渲染环节</b>或浏览器仍在跑旧版缓存脚本');
      } else {
        findings.push('云端近 10 天窗口内没有 9/1、9/2 数据 → 检查采集器是否停了');
      }
    }
    section('② 云端 Supabase（浏览器内直连）', s2);

    /* ---------- 3. 复刻计算链路 ---------- */
    const mergedMap = new Map();
    for (const r of localRecs) mergedMap.set(new Date(r.t).getTime(), r);
    for (const r of cloudRecs) { const ms = new Date(r.t).getTime(); if (!Number.isNaN(ms) && !mergedMap.has(ms)) mergedMap.set(ms, r); }
    const allRecs = Array.from(mergedMap.values()).sort((a, b) => new Date(a.t).getTime() - new Date(b.t).getTime());

    const ids = ecfg && Array.isArray(ecfg.hwIds) ? ecfg.hwIds : [];
    const baseVals = (ecfg && ecfg.baseVals) || {};
    const hist = (ecfg && ecfg.baseHistory) || [];
    const deltaIds = ids.filter(id => typeof baseVals[id] === 'number' && !Number.isNaN(baseVals[id]));

    // series: id -> 升序 [ms, v]
    const series = new Map();
    for (const id of deltaIds) {
      const arr = [];
      for (const r of allRecs) { const v = r.v ? r.v[String(id)] : null; if (typeof v === 'number' && !Number.isNaN(v)) arr.push([new Date(r.t).getTime(), v]); }
      arr.sort((a, b) => a[0] - b[0]);
      series.set(id, arr);
    }
    const histById = new Map();
    for (const id of deltaIds) {
      const hs = hist.filter(h => h.id === id).map(h => ({ base: h.base, atMs: new Date(h.at).getTime() })).sort((a, b) => a.atMs - b.atMs);
      histById.set(id, hs.length ? hs : [{ base: baseVals[id], atMs: 0 }]);
    }
    const lastRec = (id, cutoff) => { const a = series.get(id) || []; let lo = 0, hi = a.length - 1, ans = null;
      while (lo <= hi) { const mid = (lo + hi) >> 1; if (a[mid][0] <= cutoff) { ans = a[mid]; lo = mid + 1; } else hi = mid - 1; } return ans; };
    const baseRecAt = (id, atMs) => { const hs = histById.get(id) || []; let ans = null;
      for (const h of hs) { if (h.atMs <= atMs) ans = h; else break; } return ans; };
    const dayDelta = (id, y, m, d) => {
      const endOf = new Date(y, m, d, 23, 59, 59, 999).getTime();
      const prevEndOf = new Date(y, m, d - 1, 23, 59, 59, 999).getTime();
      const endRec = lastRec(id, endOf);
      if (!endRec) return { endRec: null };
      const prevRec = lastRec(id, prevEndOf);
      const bNew = baseRecAt(id, endRec[0]);
      let val, chain;
      if (!prevRec) { const b = baseRecAt(id, endRec[0]); val = b ? endRec[1] - b.base : null; chain = '首日(基准=' + (b ? b.base : '无') + ')'; }
      else if (bNew && bNew.atMs > prevRec[0]) { val = endRec[1] - bNew.base; chain = '跨换表点(新基准=' + bNew.base + ', 修改于 ' + fmt(bNew.atMs) + ')'; }
      else { val = endRec[1] - prevRec[1]; chain = '差值'; }
      return { endRec, prevRec, bNew, val, chain };
    };

    let s3 = `<div>合并后 allRecs：<b>${allRecs.length}</b> 条，最早 <code>${allRecs.length ? fmt(new Date(allRecs[0].t).getTime()) : '-'}</code>，最新 <code>${allRecs.length ? fmt(new Date(allRecs[allRecs.length - 1].t).getTime()) : '-'}</code>
      ｜参与差值计算的点位：<code>${deltaIds.join(', ') || '（无）'}</code></div>`;
    if (allRecs.length) {
      const am = statDays(allRecs);
      const days = [...am.keys()].sort().slice(-12);
      s3 += '<table><tr><th>日期</th><th>合并后条数</th><th>本地/云端补充</th></tr>' +
        days.map(d => `<tr><td>${d}</td><td>${am.get(d)}</td><td>${(lm.get(d) || 0)} + ${am.get(d) - (lm.get(d) || 0)}</td></tr>`).join('') + '</table>';
    }
    if (deltaIds.length) {
      s3 += '<table><tr><th>日期</th><th>点位</th><th>末读数</th><th>前读数</th><th>链路</th><th>dayDelta (kWh)</th></tr>';
      for (let dd = 28; dd <= 31; dd++) { const r = dayDelta(deltaIds[0], 2026, 7, dd); s3 += deltaRow('2026-08-' + dd, deltaIds[0], r); }
      for (let dd = 1; dd <= new Date().getDate() + 1; dd++) {
        const r = dayDelta(deltaIds[0], 2026, 8, dd); s3 += deltaRow('2026-09-' + dd, deltaIds[0], r);
      }
      s3 += '</table>';
      s3 += `<div class="dim">（点位 ${esc(String(deltaIds[0]))}，即对比图主柱；日界按本地时区 23:59:59 截止，与主应用一致）</div>`;
    }
    section('③ 复刻主应用计算（allRecs 合并 → 电表差值）', s3);

    /* ---------- 结论 ---------- */
    let verdict;
    if (findings.length) {
      verdict = `<div class="verdict"><b>发现的问题：</b><ul style="margin:6px 0 0 18px">` +
        findings.map(f => `<li>${f}</li>`).join('') + '</ul></div>';
    } else {
      verdict = `<div class="verdict good"><b>未发现数据断点</b>：本地+云端数据齐、配置正常、计算正常。若主页面仍显示缺柱，最可能是浏览器缓存了旧版脚本——请完全关闭该标签页后重新打开（或 Ctrl+F5），并核对页面底部版本号。</div>`;
    }
    out.push('<h1 style="font-size:16px;margin:4px 0 12px">诊断结论</h1>' + verdict);
    document.getElementById('out').innerHTML = out.join('');

    function deltaRow(label, id, r) {
      if (!r || !r.endRec) return `<tr><td>${label}</td><td>${id}</td><td colspan="4" class="warn">无末读数（当天及之前无记录）</td></tr>`;
      return `<tr><td>${label}</td><td>${id}</td>
        <td><code>${fmt(r.endRec[0])}</code> → ${r.endRec[1]}</td>
        <td>${r.prevRec ? `<code>${fmt(r.prevRec[0])}</code> → ${r.prevRec[1]}` : '<span class="dim">无</span>'}</td>
        <td>${esc(r.chain || '')}</td>
        <td><b class="${r.val == null ? 'warn' : 'ok'}">${r.val == null ? 'null' : r.val.toFixed(1)}</b></td></tr>`;
    }
  }

  window.run = run;
  run();
})();
</script>
</body>
</html>
